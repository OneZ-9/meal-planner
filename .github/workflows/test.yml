name: Test

# Runs on the two merge points in this project's branch flow:
# dev -> test (push/PR targeting "test") and test -> main (push/PR targeting "main").
on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # LayoutProps/PageProps (Next.js's typed-routes helpers, used in
      # app/layout.tsx and app/recipes/[id]/edit/page.tsx) are ambient types
      # Next.js generates into .next/types/ — normally produced as a side
      # effect of `next dev`/`next build`, which is why this only ever
      # showed up in CI (a fresh checkout has no .next/ yet). `next typegen`
      # generates just the types, without a full build, so lint/tsc below
      # can see them.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: "http://localhost:3000"
